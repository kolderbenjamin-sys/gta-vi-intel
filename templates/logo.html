<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Anton'; src: url('/templates/fonts/anton.woff2') format('woff2'); }
  @font-face { font-family: 'Rajdhani'; font-weight: 600; src: url('/templates/fonts/rajdhani-600.woff2') format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1080px; background:#0a0a12; overflow:hidden; }
  .canvas {
    position:relative; width:1080px; height:1080px;
    background: radial-gradient(circle at 50% 40%, #1a1a2e 0%, #0a0a12 70%);
    display:flex; align-items:center; justify-content:center;
  }
  .badge {
    position:relative; width:820px; height:820px; border-radius:50%;
    background: linear-gradient(145deg, #12121c, #0a0a12);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow: 0 0 0 6px rgba(255,45,138,0.35), 0 0 90px rgba(0,229,255,0.25) inset;
  }
  .ring {
    position:absolute; inset:0; border-radius:50%;
    border: 6px solid transparent;
    background: linear-gradient(135deg, #ff2d8a, #00e5ff) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  .skyline {
    display:flex; align-items:flex-end; gap:14px; height:220px; margin-bottom:36px;
  }
  .bldg { width:36px; background: linear-gradient(180deg, #ff2d8a, #00e5ff); border-radius:3px 3px 0 0; opacity:0.9; }
  .vi {
    font-family:'Anton'; font-size:220px; line-height:1; color:#fff;
    letter-spacing:4px;
    text-shadow: 0 0 40px rgba(0,229,255,0.6);
  }
  .sub {
    font-family:'Rajdhani'; font-weight:600; font-size:46px; letter-spacing:10px;
    color:#00e5ff; margin-top:18px; text-transform:uppercase;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="badge">
      <div class="ring"></div>
      <div class="skyline">
        <div class="bldg" style="height:100px"></div>
        <div class="bldg" style="height:160px"></div>
        <div class="bldg" style="height:120px"></div>
        <div class="bldg" style="height:220px"></div>
        <div class="bldg" style="height:140px"></div>
        <div class="bldg" style="height:180px"></div>
        <div class="bldg" style="height:110px"></div>
      </div>
      <div class="vi">VI</div>
      <div class="sub">intel</div>
    </div>
  </div>
</body>
</html>
